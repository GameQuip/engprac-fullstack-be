name: 🚀 Backend DevSecOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================
  # JOB 1: BACKEND CI & SECURITY (ASP.NET)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🛡️ Security - NuGet Vulnerability Check
        run: dotnet list package --vulnerable

      - name: 🔨 Build Backend
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run Backend Tests
        run: dotnet test --no-build --verbosity normal

  # ==========================================
  # JOB 2: STATIC CODE ANALYSIS (CodeQL)
  # ==========================================
  codeql-security:
    name: 🛡️ CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: "csharp" # Stripped out javascript-typescript

      - name: ⚙️ Setup .NET for CodeQL
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 🔨 Build Backend for Analysis
        run: dotnet build

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
